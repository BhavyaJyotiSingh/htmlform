<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <!--CSS CODE FROM INTERNET -->
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background-color: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        input[type="radio"] {
            width: auto;
        }

        input[type="submit"],
        input[type="reset"] {
            width: auto;
            padding: 8px 15px;
        }
    </style>
    <!--CSS CODE FROM INTERNET -->
</head>

<body>

<div class="box">

    <h2>Registration Form</h2>

    <form>

        <label>Name:</label>
        <input type="text"
               name="name"
               required
               pattern="[A-Za-z ]+"
               title="Name should contain letters only">

        <label>Email:</label>
        <input type="email"
               name="email"
               required>

        <label>Password:</label>
        <input type="password"
               name="password"
               required
               minlength="6">

        <label>Age:</label>
        <input type="number"
               name="age"
               min="1"
               required>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="male" required> Male
        <input type="radio" name="gender" value="female"> Female

        <br><br>

        <label>City:</label>
        <select name="city" required>
            <option value="">Select City</option>
            <option value="Longowal">Longowal</option>
            <option value="Sangrur">Sangrur</option>
            <option value="Ludhiana">Ludhiana</option>
        </select>

        <label>Address:</label>
        <textarea name="address" rows="4" required></textarea>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</div>

</body>
</html>
